<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="GR Brands">
  <title>GR Brands</title>
  <!-- O favicon nao e a marca solta: e a marca DENTRO de uma pastilha branca de
       cantos arredondados. A marca e preta, e sobre a barra escura de um
       navegador ela desaparecia; a pastilha da a ela o proprio papel e o icone
       passa a ser o mesmo em qualquer tema do sistema.
       O desenho de dentro e o mesmo do Logo1-icone.svg, sem uma curva mudada:
       o grupo abaixo so mapeia a viewBox original (22.5 22 84 84) para a area
       util da pastilha (17..83), que e o mesmo respiro de um icone de app. -->
  <rect width="100" height="100" rx="22" ry="22" fill="#FFFFFF"/>
  <g transform="translate(-0.6786,-0.2857) scale(0.785714)">
    <g transform="translate(25.30,24.00)"><g transform="scale(1.00125) translate(-16.0,-8.2)"><defs>
      <clipPath id="ft"><rect x="-60" y="-60" width="220" height="107"/></clipPath>
      <clipPath id="fb"><rect x="-60" y="53" width="220" height="160"/></clipPath>
    </defs>
    <g fill="#0E0E10" transform="rotate(-22 50 50)">
      <g clip-path="url(#ft)"><circle cx="50" cy="50" r="38" transform="translate(10,0)"/></g>
      <g clip-path="url(#fb)"><circle cx="50" cy="50" r="38"/></g>
    </g></g></g>
  </g>
</svg>
