<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GR Brands — Sites, identidades visuais e apps</title>
  <meta name="description" content="Estamos construindo jeitos melhores de usar a internet com o Estúdio e os Apps da GR Brands." />
  <meta name="theme-color" content="#EEEEE7" />
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
  <link rel="preload" href="fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="style.css" />

  <!-- Antes do primeiro quadro: tema, idioma e a classe .js. O tema precisa
       estar no <html> quando o glass-intro.js ler data-theme. -->
  <script>(function(){try{
    var h=document.documentElement,s=null,l=null;
    try{s=localStorage.getItem('grb-theme');l=localStorage.getItem('grb-lang');}catch(e){}
    var t=s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    h.setAttribute('data-theme',t);
    if(!l)l=/^pt/i.test(navigator.language||'pt')?'pt':'en';
    h.setAttribute('data-lang',l);h.lang=l==='pt'?'pt-BR':'en';
    h.className+=' js';
  }catch(e){}})();</script>

  <!-- ABERTURA DE VIDRO (glass-intro.js), a mesma de grbrands.com.br.
       O véu cobre a página desde o primeiro quadro. -->
  <style>
  .glass-intro{display:none;position:fixed;inset:0;z-index:2147483000;background:#EEEEE7}
  html[data-theme=dark] .glass-intro{background:#1B1B1B}
  html.is-intro{overflow:hidden}
  html.is-intro .glass-intro,.glass-intro.is-saindo,.glass-intro.is-pulando{display:block}
  .glass-intro canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .glass-intro.is-saindo{animation:gi-sai .62s cubic-bezier(.4,0,.2,1) forwards;pointer-events:none}
  .glass-intro.is-pulando{animation:gi-sai .32s ease forwards;pointer-events:none}
  @keyframes gi-sai{to{opacity:0;visibility:hidden}}
  </style>
  <script>(function(){/* em todo carregamento, exceto com movimento reduzido
    (?intro força). Se o glass-intro.js não chegar, a página volta em 4 s. */
  try{var force=/[?&]intro(=|&|$)/.test(location.search);
  if(!force&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var h=document.documentElement;h.className+=" is-intro"+(force?" is-intro-forced":"");
  window.__grbIntro=setTimeout(function(){h.classList.remove("is-intro");},4000);}catch(e){}})();</script>
</head>
<body>

<div class="glass-intro" id="glassIntro" aria-hidden="true"></div>
<script src="glass-intro.js" async></script>

<!-- Campo de cor quase imperceptível: é o que o vidro refrata. Sem ele, o
     Liquid Glass sobre um fundo liso vira só uma borda. -->
<div class="ambient" aria-hidden="true"></div>

<!-- ============ CONTROLES: TEMA + IDIOMA ============ -->
<div class="controls reveal r0">
  <button class="ctrl glass" id="themeToggle" type="button" aria-label="Mudar o tema">
    <span class="ctrl__sq" aria-hidden="true"></span>
    <span data-i18n="theme">Tema</span>
  </button>

  <div class="seg glass" role="group" aria-label="Idioma" data-i18n-aria="langGroup">
    <span class="seg__thumb" aria-hidden="true"></span>
    <button class="seg__btn" type="button" data-lang="pt" lang="pt-BR" aria-pressed="true">PT</button>
    <button class="seg__btn" type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
  </div>
</div>

<main class="page">

  <!-- ============ SELO ============ -->
  <header class="badge-wrap reveal r1">
    <a class="badge" href="./" aria-label="GR Brands, início" data-i18n-aria="homeAria">
      <svg viewBox="0 0 200 200" width="200" height="200" aria-hidden="true">
        <defs>
          <path id="badge-ring" d="M100,100 m-80,0 a80,80 0 1,1 160,0 a80,80 0 1,1 -160,0" />
          <clipPath id="bd-t"><rect x="-60" y="-60" width="220" height="107"/></clipPath>
          <clipPath id="bd-b"><rect x="-60" y="53" width="220" height="160"/></clipPath>
        </defs>
        <text class="badge__ring">
          <textPath href="#badge-ring" textLength="498" lengthAdjust="spacing">GR BRANDS · SÃO JOSÉ DO RIO PRETO · CAMPINAS ·</textPath>
        </text>
        <circle cx="100" cy="100" r="62" fill="none" stroke="currentColor" stroke-width="1.4" />
        <svg x="58" y="58" width="84" height="84" viewBox="22.5 22 84 84">
          <g transform="translate(25.30,24.00)"><g transform="scale(1.00125) translate(-16.0,-8.2)">
            <g fill="currentColor" transform="rotate(-22 50 50)">
              <g clip-path="url(#bd-t)"><circle cx="50" cy="50" r="38" transform="translate(10,0)"/></g>
              <g clip-path="url(#bd-b)"><circle cx="50" cy="50" r="38"/></g>
            </g>
          </g></g>
        </svg>
      </svg>
    </a>
  </header>

  <!-- ============ FRASE + APPS ============ -->
  <section class="lead">
    <h1 class="heading reveal r2">
      <span data-i18n="h1a">Estamos construindo jeitos melhores de usar a internet com o </span><a class="heading-link" href="https://grbrands.com.br/" target="_blank" rel="noopener noreferrer" data-i18n="h1studio">Estúdio</a><span data-i18n="h1b"> e os </span><a class="heading-link" href="https://grbrands.com.br/apps/" target="_blank" rel="noopener noreferrer" data-i18n="h1apps">Apps</a><span>.</span>
    </h1>

    <ul class="apps reveal r3">
      <li>
        <a class="button-link glass" href="https://grbrands.com.br/" target="_blank" rel="noopener noreferrer">
          <svg width="16" height="16" viewBox="22.5 22 84 84" aria-hidden="true">
            <defs>
              <clipPath id="bt-t"><rect x="-60" y="-60" width="220" height="107"/></clipPath>
              <clipPath id="bt-b"><rect x="-60" y="53" width="220" height="160"/></clipPath>
            </defs>
            <g transform="translate(25.30,24.00)"><g transform="scale(1.00125) translate(-16.0,-8.2)">
              <g fill="currentColor" transform="rotate(-22 50 50)">
                <g clip-path="url(#bt-t)"><circle cx="50" cy="50" r="38" transform="translate(10,0)"/></g>
                <g clip-path="url(#bt-b)"><circle cx="50" cy="50" r="38"/></g>
              </g>
            </g></g>
          </svg>
          <span data-i18n="btnStudio">GR Estúdio</span>
        </a>
      </li>
      <li>
        <a class="button-link glass" href="https://grbrands.com.br/apps/" target="_blank" rel="noopener noreferrer">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true">
            <rect x="1.5" y="1.5" width="5.2" height="5.2" rx="1.6"/>
            <rect x="9.3" y="1.5" width="5.2" height="5.2" rx="1.6"/>
            <rect x="1.5" y="9.3" width="5.2" height="5.2" rx="1.6"/>
            <circle cx="11.9" cy="11.9" r="2.6"/>
          </svg>
          <span data-i18n="btnApps">GR Apps</span>
        </a>
      </li>
    </ul>
  </section>

  <!-- ============ NAVEGAÇÃO ============ -->
  <footer class="foot reveal r4">
    <nav class="foot__nav glass" aria-label="Links" data-i18n-aria="navAria">
      <a class="mono-link" href="https://grbrands.com.br/#sobre" target="_blank" rel="noopener noreferrer" data-i18n="values">Valores</a>
      <a class="mono-link" href="mailto:contato@grbrands.com.br?subject=Vagas" data-i18n="jobs">Vagas</a>
      <a class="mono-link" href="mailto:contato@grbrands.com.br?subject=Newsletter" data-i18n="newsletter">Newsletter</a>
      <a class="mono-link" href="https://www.instagram.com/grbrands.studio/" target="_blank" rel="noopener noreferrer">@grbrands.studio</a>
    </nav>
  </footer>

</main>

<!-- ============ MARCAS DE RODAPÉ ============ -->
<div class="marks reveal r5" aria-hidden="true">
  <svg class="mark mark--sym" viewBox="22.5 22 84 84" width="24" height="24">
    <defs>
      <clipPath id="mk-t"><rect x="-60" y="-60" width="220" height="107"/></clipPath>
      <clipPath id="mk-b"><rect x="-60" y="53" width="220" height="160"/></clipPath>
    </defs>
    <g transform="translate(25.30,24.00)"><g transform="scale(1.00125) translate(-16.0,-8.2)">
      <g fill="currentColor" transform="rotate(-22 50 50)">
        <g clip-path="url(#mk-t)"><circle cx="50" cy="50" r="38" transform="translate(10,0)"/></g>
        <g clip-path="url(#mk-b)"><circle cx="50" cy="50" r="38"/></g>
      </g>
    </g></g>
  </svg>
  <span class="mark mark--mono">G<i>R</i></span>
  <span class="mark mark--ring"><span>GR</span></span>
  <span class="mark mark--stack">GR Brands<br />Rio Preto<br />Campinas</span>
  <span class="mark mark--code">[GRB]</span>
</div>
<small class="sr-only">© 2026 GR Brands</small>

<script src="app.js" defer></script>
</body>
</html>
